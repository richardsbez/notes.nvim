# Hyprland 0.53 / 0.54 (hyprland.conf)
windowrule = match:class ^(notes-popup)$, float on
windowrule = match:class ^(notes-popup)$, size 900 600
windowrule = match:class ^(notes-popup)$, center on

bind = SUPER, N, exec, $HOME/.local/bin/notes-popup

# Hyprland < 0.53 (legacy syntax):
# windowrulev2 = float, class:^(notes-popup)$
# windowrulev2 = size 900 600, class:^(notes-popup)$
# windowrulev2 = center, class:^(notes-popup)$
